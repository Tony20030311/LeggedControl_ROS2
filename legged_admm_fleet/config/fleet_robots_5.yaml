# 5× Vision60 fleet roster — the N=5 case (spec §10: the N=3 blind spot is that every close
# approach has only two possible observers, so a symmetric 1-vs-1 disagreement has no third party
# to break it; relayed evidence and trust_total's sum clamp only become non-trivial at N >= 4).
#
# Spawn poses = the "V5" offsets in fleet_config.cpp: a centroid-centred regular pentagon,
# circumradius 1.25 m. Side 1.469 m clears the 1.4 m geometry floor with margin, the longest
# diagonal is 2.378 m so EVERY pair is inside obs_range 4.0 and mutually observable — which is
# the scientific point of running N=5 at all — and the centroid is exactly the origin, so
# centroid_slot_targets translates the shape without reassignment on the first goal.
#
# Same convention as fleet_robots.yaml: spawn_poses = [x, y, z, yaw].
robot1:
  robot_type: vision60
  robot_name: robot1
  spawn_poses: [1.250, 0.000, 0.2, 0.0]
  controller_config_file: ""

robot2:
  robot_type: vision60
  robot_name: robot2
  spawn_poses: [0.386, 1.189, 0.2, 0.0]
  controller_config_file: ""

robot3:
  robot_type: vision60
  robot_name: robot3
  spawn_poses: [-1.011, 0.735, 0.2, 0.0]
  controller_config_file: ""

robot4:
  robot_type: vision60
  robot_name: robot4
  spawn_poses: [-1.011, -0.735, 0.2, 0.0]
  controller_config_file: ""

robot5:
  robot_type: vision60
  robot_name: robot5
  spawn_poses: [0.386, -1.189, 0.2, 0.0]
  controller_config_file: ""
