# 3x vision60 fleet roster, each dog carrying a lidar. Identical to fleet_robots.yaml except for
# description_package, including the "V" equilateral-triangle spawn (side 1.40 m, apex forward),
# so results taken with this roster stay comparable to every run taken with the plain one.
#
# description_package sends the URDF to legged_admm_fleet/urdf/vision60/robot.xacro -- stock
# vision60 plus the lidar. robot_type deliberately stays "vision60": legged_robot_controller
# supports that name and no other, and skips robots it does not recognise without an error, so a
# new type name spawns fine and then hangs in load_controller forever. See the header of
# urdf/vision60/robot.xacro.
robot1:
  robot_type: vision60
  description_package: legged_admm_fleet
  robot_name: robot1
  spawn_poses: [0.808, 0.0, 0.2, 0.0]
  controller_config_file: ""

robot2:
  robot_type: vision60
  description_package: legged_admm_fleet
  robot_name: robot2
  spawn_poses: [-0.404, -0.7, 0.2, 0.0]
  controller_config_file: ""

robot3:
  robot_type: vision60
  description_package: legged_admm_fleet
  robot_name: robot3
  spawn_poses: [-0.404, 0.7, 0.2, 0.0]
  controller_config_file: ""
