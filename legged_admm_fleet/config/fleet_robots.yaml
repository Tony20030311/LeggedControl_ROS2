# 3× Vision60 fleet roster (passed as robots_config_file to gazebo.launch.py and
# load_controller.launch.py — submodule's multi_robots.yaml stays untouched).
# Spawn poses = the "V" equilateral-triangle offsets (side 1.40 m, apex forward), so the
# dogs start already in formation and the first /formation/goal barely reassigns them.
robot1:
  robot_type: vision60
  robot_name: robot1
  spawn_poses: [0.808, 0.0, 0.2, 0.0]
  controller_config_file: ""

robot2:
  robot_type: vision60
  robot_name: robot2
  spawn_poses: [-0.404, -0.7, 0.2, 0.0]
  controller_config_file: ""

robot3:
  robot_type: vision60
  robot_name: robot3
  spawn_poses: [-0.404, 0.7, 0.2, 0.0]
  controller_config_file: ""

